version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: call-analytics-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    expose:
      - "5432"
    volumes:
      - ./data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 200m
        max-file: "3"

  # Backend (FastAPI)
  backend:
    image: call-analytics-backend:latest
    container_name: call-analytics-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${FASTAPI_PORT}:8001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${DB_NAME}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_FALLBACK_MODEL: ${OPENAI_FALLBACK_MODEL:-gpt-5-mini}
      OPENAI_DIRECT_MODEL: ${OPENAI_DIRECT_MODEL:-gpt-5.4}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      GEMINI_DIRECT_MODEL: ${GEMINI_DIRECT_MODEL:-gemini-3-flash-preview}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      KIE_DISABLED: ${KIE_DISABLED:-1}
      KIE_API_KEY: ${KIE_API_KEY:-}
      KIE_PRIMARY_BASE_URL: ${KIE_PRIMARY_BASE_URL:-https://api.kie.ai/gemini-3-flash/v1}
      KIE_FALLBACK_BASE_URL: ${KIE_FALLBACK_BASE_URL:-https://api.kie.ai/gemini-3-pro/v1}
      LLM_MODEL: ${LLM_MODEL:-gemini-3-flash}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-gemini-3-pro}
      MAX_BATCH_SIZE: ${MAX_BATCH_SIZE:-50000}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-2000}
      AUDIO_RETENTION_DAYS: ${AUDIO_RETENTION_DAYS:-0}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}
      CALLTOUCH_WEBHOOK_SECRET: ${CALLTOUCH_WEBHOOK_SECRET:-}
      PIPELINE_CONCURRENCY: ${PIPELINE_CONCURRENCY:-4}
      # Транскрибация + диаризация одним вызовом мультимодальной модели.
      # audio_dialog — основной путь (18.08.2026), openai_quad — исторический
      # (gpt-4o-transcribe ×3 + whisper-1 + мерж), он же fallback.
      # Откат целиком: TRANSCRIPTION_MODE=openai_quad + recreate.
      TRANSCRIPTION_MODE: ${TRANSCRIPTION_MODE:-audio_dialog}
      AUDIO_DIALOG_CHAIN: ${AUDIO_DIALOG_CHAIN:-gemini:gemini-3.7-flash,gemini:gemini-3-flash-preview}
      AUDIO_DIALOG_FALLBACK_TO_OPENAI: ${AUDIO_DIALOG_FALLBACK_TO_OPENAI:-1}
      AUDIO_DIALOG_CROSSCHECK: ${AUDIO_DIALOG_CROSSCHECK:-1}
      AUDIO_DIALOG_TIMEOUT: ${AUDIO_DIALOG_TIMEOUT:-300}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/audio:/app/data/audio
      - ./data/mango_sftp/uploads:/app/data/mango_sftp/uploads
      - ./data/calltouch_records:/app/data/calltouch_records
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 200m
        max-file: "3"

  # Frontend (React)
  frontend:
    image: call-analytics-frontend:latest
    container_name: call-analytics-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:3000"
    environment:
      VITE_API_URL: http://localhost:${FASTAPI_PORT}
    depends_on:
      - backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 200m
        max-file: "3"

  # МАНГО FTP Sync Service
  mango-sync:
    image: call-analytics-mango-sync:latest
    container_name: call-analytics-mango-sync
    build:
      context: ./sync
      dockerfile: Dockerfile
    environment:
      MANGO_FTP_HOST: ${MANGO_FTP_HOST}
      MANGO_FTP_USER: ${MANGO_FTP_USER}
      MANGO_FTP_PASSWORD: ${MANGO_FTP_PASSWORD}
      CALL_ANALYTICS_URL: http://backend:8001/api/v1/upload
      SYNC_TIME: "06:00"
    depends_on:
      - backend
    volumes:
      - ./data/mango_sync:/app/data/mango_sync
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 200m
        max-file: "3"

volumes:
  db_data:

networks:
  default:
    name: call-analytics-network
